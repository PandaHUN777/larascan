name: 🐛 Bug Report
description: File a bug report to help us improve Larascan
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check existing issues before submitting.
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: What PHP and Laravel version are you running?
      placeholder: "PHP: 8.4.1, Laravel: 12.x, OS: Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior or a minimal code sample that causes the issue.
      placeholder: |
        1. Run `vendor/bin/larascan app/Services`
        2. Encounter error: ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Command Output or Stack Trace
      description: Please copy and paste any relevant CLI terminal output or stack traces.
      render: shell
    validations:
      required: false
